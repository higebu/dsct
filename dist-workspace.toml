[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Pass --all-features to cargo
all-features = true
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
# A GitHub repo to push Homebrew formulas to
tap = "higebu/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]

# Commit SHAs for the actions dist writes into .github/workflows/release.yml.
# That file is generated, and `dist plan` fails the Release workflow when its
# contents drift, so the pins have to come from here rather than being edited
# into the workflow. Renovate is kept off release.yml for the same reason (see
# renovate.json); update these by hand when an action is bumped.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"          # v6
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131" # v7
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f"   # v6
